[extensions.rest]
path = "grafbase_extensions/rest/0.5.2"

# Config for the rest extension. The extension looks up config.subgraphs.<name>
# and exposes that object to @restEndpoint header templates as `{{ config.* }}`.
# Keys are read from the environment so no secrets live in the repo.
# (fundsApiKey moved to the `funds` subgraph server — it calls the Funds REST API.)
[extensions.rest.config.subgraphs.insurance]
accountsApiKey = "{{ env.ACCOUNTS_API_KEY }}"
policiesApiKey = "{{ env.POLICIES_API_KEY }}"

# --- `insurance` subgraph — accounts + policies via the REST extension, plus a
#     Fund STUB (@key only). Virtual/in-process; not itself entity-cached.
[subgraphs.insurance]
schema_path = "schema.graphql"

# --- `funds` subgraph — a REAL GraphQL federation subgraph (funds-subgraph/,
#     GraphQL Yoga) reached over HTTP. Because Fund is resolved here via a real
#     `_entities` fetch, THIS is the subgraph whose responses ENTITY CACHING
#     stores in Redis. Start funds-subgraph/server.js before the gateway.
#     schema_path lets `grafbase compose` read the SDL without the server running.
[subgraphs.funds]
url = "http://localhost:3009/graphql"
# url = "http://host.docker.internal:3009/graphql"
schema_path = "funds-subgraph/funds.graphql"

# Entity caching for the funds subgraph (overrides the global ttl below).
[subgraphs.funds.entity_caching]
enabled = true
ttl = "120s"

[graph]
path = "/graphql"
introspection = true

# ===========================================================================
# CACHING — full details & testing guide in Docs/CACHING.md
# Both blocks below activate only under the PRODUCTION gateway
# (grafbase-gateway). `grafbase dev` ignores caching, so it is a no-op with the
# current docker-compose command (which runs `grafbase dev`).
#
# The Redis endpoint is env-driven, but NOTE: the gateway (0.53.5) does NOT
# interpolate {{ env.* }} in the caching `redis.url` field (that templating only
# works for the REST-extension config). So the url below is a concrete default,
# and the REDIS_URL env var is substituted into it at startup by our tooling:
#   - docker (Dockerfile.gateway): docker/gateway-entrypoint.sh substitutes
#     $REDIS_URL (defaults to redis://redis:6379, the `redis` compose service).
#   - host testing: rewrite redis://redis:6379 -> redis://localhost:6379 with the
#     sed step in Docs/CACHING.md before running the gateway.
# Use a rediss:// URL (+ a [*.redis.tls] table) for TLS.
# ===========================================================================

# --- Operation caching — VERIFIED WORKING with Redis (writes cached query
# plans; see Docs/CACHING.md). Presence of [operation_caching.redis] switches
# the backend to Redis (no `storage` key, unlike entity caching below).
[operation_caching]
enabled = true
limit = 1000

[operation_caching.redis]
url = "redis://redis:6379"          # env-overridable via REDIS_URL (substituted at startup — see note above)
key_prefix = "insurance-opcache"

# --- Entity caching — NOW FUNCTIONAL. With the `funds` subgraph split out as a
# real GraphQL subgraph, the gateway resolves Fund via `_entities` fetches whose
# responses are cached here (verified: one `insurance-entitycache*` key per Fund,
# repeat queries served from cache, TTL applied, survives restart). See
# funds-subgraph/README.md. storage MUST be "redis" (defaults to "memory").
[entity_caching]
enabled = true
ttl = "60s"
storage = "redis"

[entity_caching.redis]
url = "redis://redis:6379"          # env-overridable via REDIS_URL (substituted at startup — see note above)
key_prefix = "insurance-entitycache"
