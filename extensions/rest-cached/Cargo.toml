# =============================================================================
# `rest-cached` — a fork of the official Grafbase `rest` resolver extension
# (Apache-2.0, https://github.com/grafbase/extensions/tree/main/extensions/rest)
# with a Redis/Valkey response cache bolted onto its single HTTP call site.
#
# Pinned to the same SDK the upstream 0.5.2 build used (sdk_version 0.22.1 in
# grafbase_extensions/rest/0.5.2/manifest.json) so the artifact stays loadable
# by gateway 0.53.5. `template` is an internal crate of the extensions repo, so
# it comes from git rather than crates.io.
# =============================================================================
[package]
name = "rest-cached"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
grafbase-sdk = { version = "0.22.1", features = ["jq-selection"] }
hashbrown = "0.15"
http = "1.3"
rapidhash = "1.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
template = { git = "https://github.com/grafbase/extensions", package = "template" }

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
