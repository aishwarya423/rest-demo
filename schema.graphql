# =============================================================================
# `insurance` subgraph — accounts + policies resolved via the REST extension,
# plus a Fund STUB (@key only).
#
# The FULL Fund entity now lives in a SEPARATE real GraphQL subgraph
# (funds-subgraph/, GraphQL Yoga). Because Fund is resolved ACROSS a subgraph
# boundary via a real `_entities` fetch, ENTITY CACHING now works (see
# funds-subgraph/README.md and Docs/CACHING.md). Accounts/policies behaviour and
# the client-facing schema are unchanged — only Fund's resolution moved.
#
# ⚠️  MANUALLY EDITED for entity caching. schema-gen was intentionally NOT
#     updated, so `npm run schema:generate` / `schema:promote` WILL OVERWRITE
#     this file. Re-apply these edits (or teach schema-gen the split) if you
#     regenerate.
# =============================================================================
extend schema
  @link(url: "https://grafbase.com/extensions/rest/0.5.2", import: ["@restEndpoint", "@rest"])
  @link(
    url: "https://specs.grafbase.com/composite-schemas/v1"
    import: ["@key", "@require", "@inaccessible"]
  )
  @restEndpoint(
    name: "accounts"
    baseURL: "http://localhost:3001"
    # baseURL: "http://host.docker.internal:3001"
    # baseURL: "http://accounts-rest:3001"
    headers: [{ name: "X-Api-Key", value: "{{ config.accountsApiKey }}" }]
  )
  @restEndpoint(
    name: "policies"
    baseURL: "http://localhost:3003"
    # baseURL: "http://host.docker.internal:3003"
    # baseURL: "http://policies-rest:3003"
    headers: [{ name: "X-Api-Key", value: "{{ config.policiesApiKey }}" }]
  )

# NOTE: the `funds` REST endpoint is gone from this subgraph — Fund is now owned
# by the `funds` GraphQL subgraph, which wraps the funds REST API itself.

scalar Date

type Account {
  id: ID!
  customerId: ID!
  holderName: String!
  accountType: AccountType!
  status: AccountStatus!
  openedDate: Date!
  """null for non-pension accounts"""
  pensionProvider: String
  riskProfile: RiskProfile!
  totalValue: Float!
  """Percent; 0 when not contributing"""
  contributionRate: Float!
  fundHoldings: [FundHolding!]!
}

type FundHolding {
  fundId: ID! @inaccessible
  allocationPercent: Float!
  units: Float!
  currentValue: Float!
  # Cross-subgraph Fund reference — only the key is known here; fund.* fields are
  # resolved from the `funds` subgraph via a cacheable `_entities` fetch. The key
  # is produced from fundId in the @rest selection below.
  fund: Fund!
}

# STUB: this subgraph only knows Fund's key. Everything else comes from `funds`.
type Fund @key(fields: "id") {
  id: ID!
}

type Policy {
  id: ID!
  policyNumber: String!
  accountId: ID!
  customerId: ID!
  policyType: PolicyType!
  productName: String!
  status: PolicyStatus!
  startDate: Date!
  premiumMonthly: Float!
  """0 when not applicable"""
  sumAssured: Float!
  insuredPerson: String!
  """Ids of funds the policy invests in; empty when none"""
  fundIds: [ID!]! @inaccessible
  # Cross-subgraph Fund references (keys produced from fundIds in the @rest
  # selection below); each Fund resolved from the `funds` subgraph.
  linkedFunds: [Fund!]!
}

enum AccountType {
  PENSION
  INVESTMENT_ISA
}

enum AccountStatus {
  ACTIVE
}

enum RiskProfile {
  CAUTIOUS
  BALANCED
  GROWTH
}

enum PolicyStatus {
  IN_FORCE
  ACCUMULATING
}

enum PolicyType {
  LIFE_INSURANCE
  PENSION_ANNUITY
  INVESTMENT_BOND
}

type Query {
  # Entry point -> GET /accounts/{id}
  account(id: ID!): Account
    @rest(
      endpoint: "accounts"
      http: { GET: "/accounts/{{ args.id }}" }
      selection: """
      {
        id,
        customerId,
        holderName,
        accountType,
        status,
        openedDate,
        pensionProvider,
        riskProfile,
        totalValue,
        contributionRate,
        fundHoldings: [.fundHoldings[] | {
          fundId,
          allocationPercent,
          units,
          currentValue,
          fund: { id: .fundId }
        }]
      }
      """
    )

  # Convenience list -> GET /accounts
  accounts: [Account!]!
    @rest(
      endpoint: "accounts"
      http: { GET: "/accounts" }
      selection: """
      [.[] | {
        id,
        customerId,
        holderName,
        accountType,
        status,
        openedDate,
        pensionProvider,
        riskProfile,
        totalValue,
        contributionRate,
        fundHoldings: [.fundHoldings[] | {
          fundId,
          allocationPercent,
          units,
          currentValue,
          fund: { id: .fundId }
        }]
      }]
      """
    )
}

extend type Account {
  # Parent account.id is injected as `accountId` via @require (hidden from the
  # client) -> GET /accounts/{accountId}/policies on the policies service.
  policies(accountId: ID! @require(field: "id")): [Policy!]!
    @rest(
      endpoint: "policies"
      http: { GET: "/accounts/{{ args.accountId }}/policies" }
      selection: """
      [.[] | {
        id,
        policyNumber,
        accountId,
        customerId,
        policyType,
        productName,
        status,
        startDate,
        premiumMonthly,
        sumAssured,
        insuredPerson,
        fundIds,
        linkedFunds: [.fundIds[] | { id: . }]
      }]
      """
    )
}
