# =============================================================================
# Production-gateway compose — runs `grafbase-gateway` (NOT `grafbase dev`) so
# Redis caching ACTUALLY ENGAGES, including ENTITY caching via the funds subgraph.
# Everything runs in Docker — no host tools needed.
#
# ─── RUN ──────────────────────────────────────────────────────────────────────
#   docker compose -f docker-compose.gateway.yml up --build -d
#   docker compose -f docker-compose.gateway.yml ps          # wait until healthy
#   GraphQL: http://localhost:5060/graphql
#
# ─── TEST REDIS (ENTITY) CACHING ─────────────────────────────────────────────
#   # 1. clear the cache
#   docker compose -f docker-compose.gateway.yml exec redis redis-cli FLUSHALL
#
#   # 2. run a query that crosses into the funds subgraph (twice)
#   curl -s localhost:5060/graphql -H 'content-type: application/json' \
#     -d '{"query":"{ account(id:\"acct-1001\"){ fundHoldings { fund { id name currency } } } }"}'
#
#   # 3. see the ENTITY cache keys (one per Fund) + their TTL
#   docker compose -f docker-compose.gateway.yml exec redis \
#     redis-cli --scan --pattern 'insurance-entitycache*'
#   docker compose -f docker-compose.gateway.yml exec redis \
#     redis-cli --scan --pattern 'insurance-opcache*'          # operation cache too
#
#   # 4. dump the whole cache to a file (auto-detects the container + CLI)
#   scripts/dump-redis-cache.sh
#
# ─── SAME THING ON VALKEY ────────────────────────────────────────────────────
#   CACHE_IMAGE=valkey/valkey:8-alpine CACHE_CLI=valkey-cli \
#     docker compose -f docker-compose.gateway.yml up --build -d
#   # then use `valkey-cli` for exec commands, e.g.:
#   docker compose -f docker-compose.gateway.yml exec redis valkey-cli --scan --pattern 'insurance-entitycache*'
#   # (scripts/dump-redis-cache.sh auto-detects valkey-cli too)
#
# ─── OR the one-command scripts ──────────────────────────────────────────────
#   scripts/run-redis-cache-test.sh     # run + verify + report (Redis)
#   scripts/run-valkey-cache-test.sh    # run + verify + report (Valkey)
#
# Standalone: run this INSTEAD of the default docker-compose.yml (they share
# ports 3001-3003/3009/6379), not alongside it.
# =============================================================================
services:

  accounts-rest:
    build:
      context: ./mock-rest-apis/accounts
    environment:
      SERVICE_NAME: accounts
      EXPECTED_API_KEY: ${ACCOUNTS_API_KEY:-accounts-local-key}
    ports:
      - "3001:3001"

  policies-rest:
    build:
      context: ./mock-rest-apis/policies
    environment:
      SERVICE_NAME: policies
      EXPECTED_API_KEY: ${POLICIES_API_KEY:-policies-local-key}
    ports:
      - "3003:3003"

  funds-rest:
    build:
      context: ./mock-rest-apis/funds
    environment:
      SERVICE_NAME: funds
      EXPECTED_API_KEY: ${FUNDS_API_KEY:-funds-local-key}
    ports:
      - "3002:3002"

  # ---------------------------------------------------------------------------
  # Tag-invalidated cache at the REST boundary. Sits between the gateway's REST
  # extension / funds-subgraph and the three REST services, caching GET responses
  # in Redis db 1 with a real tag -> keys SET index. This is the layer Grafbase
  # Entity Cache cannot provide (its keys are unreconstructible hashes and it has
  # no delete). See rest-cache/README.md.
  #
  # Toggle it OFF without editing anything: point the consumers back at the REST
  # services directly (ACCOUNTS_UPSTREAM / POLICIES_UPSTREAM / FUNDS_REST_URL).
  # ---------------------------------------------------------------------------
  rest-cache:
    build:
      context: ./rest-cache
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "1"                       # db 0 is Grafbase's; never collide
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-600}"
    depends_on:
      redis:
        condition: service_healthy
      accounts-rest:
        condition: service_started
      policies-rest:
        condition: service_started
      funds-rest:
        condition: service_started
    ports:
      - "3101:3101"   # -> accounts-rest:3001
      - "3102:3102"   # -> funds-rest:3002
      - "3103:3103"   # -> policies-rest:3003

  # The `funds` GraphQL federation subgraph (Yoga). This is the REAL subgraph
  # whose `_entities` responses ENTITY CACHING stores in Redis. It wraps the
  # funds REST service.
  funds-subgraph:
    build:
      context: ./funds-subgraph
    environment:
      FUNDS_SUBGRAPH_PORT: 3009
      FUNDS_REST_URL: ${FUNDS_REST_URL:-http://rest-cache:3102}   # was http://funds-rest:3002
      FUNDS_API_KEY: ${FUNDS_API_KEY:-funds-local-key}
    depends_on:
      funds-rest:
        condition: service_started
      rest-cache:
        condition: service_started
    ports:
      - "3009:3009"

  # Cache backend — Redis by default, or Valkey (a drop-in Redis fork; same RESP
  # protocol + port, so the gateway config is IDENTICAL). Switch with env vars:
  #   Redis  (default):  docker compose -f docker-compose.gateway.yml up --build
  #   Valkey          :  CACHE_IMAGE=valkey/valkey:8-alpine CACHE_CLI=valkey-cli \
  #                        docker compose -f docker-compose.gateway.yml up --build
  # Note: the Valkey image ships `valkey-cli` (not `redis-cli`), so the healthcheck
  # CLI is env-driven too. Service name stays `redis` (just a label); the gateway
  # reaches it at redis://redis:6379 either way. Persisted via the redis-data volume.
  redis:
    image: ${CACHE_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "${CACHE_CLI:-redis-cli}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Production gateway — composes the 2-subgraph federation and serves it with
  # operation + entity caching against Redis.
  grafbase-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "5060:5060"
    depends_on:
      accounts-rest:
        condition: service_started
      policies-rest:
        condition: service_started
      funds-rest:
        condition: service_started
      funds-subgraph:
        condition: service_started
      rest-cache:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      # Redis endpoint substituted into grafbase.toml by the entrypoint.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Forwarded to @restEndpoint headers via grafbase.toml -> {{ config.* }}.
      ACCOUNTS_API_KEY: ${ACCOUNTS_API_KEY:-accounts-local-key}
      POLICIES_API_KEY: ${POLICIES_API_KEY:-policies-local-key}
      # REST extension talks to the tag-invalidated cache, not the REST services
      # directly. Set these back to http://accounts-rest:3001 /
      # http://policies-rest:3003 to bypass the cache entirely.
      ACCOUNTS_UPSTREAM: ${ACCOUNTS_UPSTREAM:-http://rest-cache:3101}
      POLICIES_UPSTREAM: ${POLICIES_UPSTREAM:-http://rest-cache:3103}
      # Grafbase's entity cache masks rest-cache invalidation for its whole TTL.
      # Low by default so tag invalidation is demonstrable; 120s restores the
      # original entity-caching demo.
      FUNDS_ENTITY_TTL: ${FUNDS_ENTITY_TTL:-5s}

volumes:
  # Shares the same named volume as docker-compose.yml (same compose project),
  # so cached keys persist across restarts.
  redis-data:
