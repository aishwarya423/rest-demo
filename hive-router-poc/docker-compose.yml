# ===========================================================================
# Hive ROUTER POC — 3 REST APIs -> 3 federation subgraphs -> Hive Router
# Caching lives in the subgraphs, because the router has none.
# ===========================================================================
#   docker compose -f hive-router-poc/docker-compose.yml up --build -d
#
#   GraphQL (router)  http://localhost:4000/graphql
#   Invalidator       http://localhost:8090
#   Valkey            localhost:6379
#   Subgraphs         :4001 accounts  :4002 policies  :4003 funds
#
# Ports are deliberately clear of the hive-poc stack except 4000/6379/8090, so
# do not run both at once.
# ===========================================================================
name: hive-router-poc

x-subgraph-base: &subgraph-base
  build:
    context: ./subgraphs
  depends_on:
    valkey: { condition: service_healthy }
  environment: &subgraph-env
    REDIS_URL: redis://valkey:6379
    CACHE_ENABLED: ${CACHE_ENABLED:-1}
    CACHE_EXTENSION_METADATA: ${CACHE_EXTENSION_METADATA:-1}

services:
  # ---------------------------------------------------------------- REST tier
  # The three existing services, reused unchanged from ../mock-rest-apis.
  accounts-rest:
    build: { context: ../mock-rest-apis/accounts }
    environment:
      SERVICE_NAME: accounts
      EXPECTED_API_KEY: ${ACCOUNTS_API_KEY:-accounts-local-key}
    ports: ["3001:3001"]

  policies-rest:
    build: { context: ../mock-rest-apis/policies }
    environment:
      SERVICE_NAME: policies
      EXPECTED_API_KEY: ${POLICIES_API_KEY:-policies-local-key}
    ports: ["3003:3003"]

  funds-rest:
    build: { context: ../mock-rest-apis/funds }
    environment:
      SERVICE_NAME: funds
      EXPECTED_API_KEY: ${FUNDS_API_KEY:-funds-local-key}
    ports: ["3002:3002"]

  # --------------------------------------------------------------- cache tier
  # Valkey is a drop-in Redis fork. Swap the image for redis:7-alpine if you
  # prefer Redis; nothing else changes.
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["valkey-data:/data"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------ subgraph tier
  # One image, three containers. SUBGRAPH picks the schema; each owns the TTL
  # for its own data and caches its own responses in Valkey.
  accounts-subgraph:
    <<: *subgraph-base
    environment:
      <<: *subgraph-env
      SUBGRAPH: accounts
      PORT: 4001
      REST_URL: http://accounts-rest:3001
      REST_API_KEY: ${ACCOUNTS_API_KEY:-accounts-local-key}
      CACHE_TTL_MS: ${ACCOUNTS_TTL_MS:-30000}
    ports: ["4001:4001"]

  policies-subgraph:
    <<: *subgraph-base
    environment:
      <<: *subgraph-env
      SUBGRAPH: policies
      PORT: 4002
      REST_URL: http://policies-rest:3003
      REST_API_KEY: ${POLICIES_API_KEY:-policies-local-key}
      CACHE_TTL_MS: ${POLICIES_TTL_MS:-120000}
    ports: ["4002:4002"]

  funds-subgraph:
    <<: *subgraph-base
    environment:
      <<: *subgraph-env
      SUBGRAPH: funds
      PORT: 4003
      REST_URL: http://funds-rest:3002
      REST_API_KEY: ${FUNDS_API_KEY:-funds-local-key}
      CACHE_TTL_MS: ${FUNDS_TTL_MS:-300000}
    ports: ["4003:4003"]

  # -------------------------------------------------------------- build stage
  # Composes the three subgraph SDLs into one federation supergraph, writes it
  # to the shared volume and exits. "Exited (0)" is success, not a failure.
  supergraph-compose:
    build:
      context: .
      dockerfile: compose/Dockerfile
    environment:
      ACCOUNTS_SUBGRAPH_URL: http://accounts-subgraph:4001/graphql
      POLICIES_SUBGRAPH_URL: http://policies-subgraph:4002/graphql
      FUNDS_SUBGRAPH_URL: http://funds-subgraph:4003/graphql
    volumes: ["supergraph:/out"]

  # ------------------------------------------------------------- router tier
  # Official Rust router image. Note it gets no Redis and no cache config:
  # it cannot cache responses. See router/router.config.yaml.
  hive-router:
    image: ghcr.io/graphql-hive/router:latest
    ports: ["4000:4000"]
    volumes:
      - ./router/router.config.yaml:/app/router.config.yaml:ro
      - supergraph:/supergraph:ro
    depends_on:
      supergraph-compose: { condition: service_completed_successfully }
      accounts-subgraph: { condition: service_started }
      policies-subgraph: { condition: service_started }
      funds-subgraph: { condition: service_started }

  # ------------------------------------------------------- invalidation tier
  # Talks only to Valkey. Imports nothing from Hive or the subgraphs.
  invalidator:
    build: { context: ./invalidator }
    ports: ["8090:8090"]
    environment:
      REDIS_URL: redis://valkey:6379
      PORT: 8090
    depends_on:
      valkey: { condition: service_healthy }

  # --------------------------------------------- comparison: Gateway runtime
  # Hive Gateway running the SAME supergraph with Router's query planner and
  # executor (--hive-router-runtime). Lets you compare the Rust router against
  # the Rust planner hosted in Node, on identical inputs.
  #
  #   docker compose -f hive-router-poc/docker-compose.yml --profile compare up -d
  #   -> http://localhost:4010/graphql
  gateway-router-runtime:
    profiles: ["compare"]
    image: ghcr.io/graphql-hive/gateway:latest
    command:
      - supergraph
      - /supergraph/supergraph.graphql
      - --hive-router-runtime
      - --host
      - 0.0.0.0
      - --port
      - "4010"
    ports: ["4010:4010"]
    volumes: ["supergraph:/supergraph:ro"]
    depends_on:
      supergraph-compose: { condition: service_completed_successfully }

volumes:
  valkey-data:
  supergraph:
